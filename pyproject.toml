[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buglens"
version = "0.1.0"
description = "From a UI bug screenshot to a mergeable fix PR — evidence-chained multimodal bug-fixing agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "BugLens contributors" }]
keywords = ["agent", "langgraph", "vlm", "bug-fixing", "playwright", "multimodal", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
  "typer>=0.12",
  "langgraph>=1.2",
  "playwright>=1.40",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.scripts]
buglens = "buglens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
